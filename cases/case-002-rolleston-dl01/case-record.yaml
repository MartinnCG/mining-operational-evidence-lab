design_hypotheses:
  - hypothesis_id: HYP-002-001
    statement: Tool, consumable, and work-front readiness should be visible as separate dependencies rather than embedded in free-text handover.
    status: pending_synthetic_test
  - hypothesis_id: HYP-002-002
    statement: Handover should distinguish work completed, work prepared, work waiting for authorization, and work blocked by interacting activities.
    status: pending_synthetic_test
  - hypothesis_id: HYP-002-003
    statement: A longitudinal swing model should preserve shift-pattern transitions and role boundaries without reproducing live operational records.
    status: pending_synthetic_test
  - hypothesis_id: HYP-002-004
    statement: Shared-tool availability and return state can be modelled as an operational dependency with an owner and next action.
    status: pending_synthetic_test

