design_hypotheses:
  - hypothesis_id: HYP-001
    statement: Sequenced multi-trade work benefits from explicit dependency-state visibility during handover.
    status: pending_synthetic_test
  - hypothesis_id: HYP-002
    statement: Material readiness should be represented as an owned dependency rather than hidden inside free text.
    status: pending_synthetic_test
  - hypothesis_id: HYP-003
    statement: Reported progress, evidence disposition, and authority must remain separate dimensions.
    status: represented_in_contract_v1

authority_boundary:
  authorizes_work: false
  confirms_isolation: false
  approves_permit: false
  declares_safe: false
  confirms_completion: false
  statement: Evidence and professional-learning record only. Follow site procedures and competent-person authority.
