name: Contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate examples
        run: python scripts/validate_handover.py examples/valid
      - name: Run tests
        run: python -m unittest discover -s tests -v
